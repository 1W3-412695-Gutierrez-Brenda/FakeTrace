<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakeTrace - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg-0:#03040a; --bg-1:#06101a; --neon-cyan:#00f0ff; --neon-purple:#a66bff; --glass:rgba(255,255,255,0.04);
            --card-bg:rgba(18,22,30,0.34); --card-border:rgba(160,120,255,0.12); --muted:#9aa7b7; --text:#eaf6ff;
            --accent:#7c5cff; --success:#32d0a0; --danger:#ff6b7a;
        }
        *{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;padding:0;display:flex;align-items:center;justify-content:center;
            font-family:'Inter',system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);
            background: radial-gradient(circle at 10% 10%, rgba(124,92,255,0.06), transparent 12%),
                        radial-gradient(circle at 90% 80%, rgba(0,240,255,0.04), transparent 14%),
                        linear-gradient(180deg,var(--bg-0),var(--bg-1));
            overflow:hidden;
        }
        /* Scene: animated stars + nebula */
        .scene{position:fixed;inset:0;z-index:0;pointer-events:none}
        .stars, .nebula{position:absolute;inset:0}
        .stars::after{content:'';position:absolute;inset:0;background-image:radial-gradient(#ffffff22 1px, transparent 1px);background-size:20px 20px;opacity:0.5;mix-blend-mode:screen;filter:blur(0.6px);animation:twinkle 12s linear infinite}
        @keyframes twinkle{0%{opacity:.3}50%{opacity:.9}100%{opacity:.3}}
        .nebula{background:radial-gradient(ellipse at 20% 30%, rgba(124,92,255,0.12), transparent 12%), radial-gradient(ellipse at 80% 70%, rgba(0,240,255,0.08), transparent 14%);filter:blur(30px);opacity:0.95;transform:translateZ(0);animation:slowmove 40s linear infinite}
        @keyframes slowmove{0%{transform:translateX(-6%)}50%{transform:translateX(6%)}100%{transform:translateX(-6%)}}
        .planet{position:absolute;width:220px;height:220px;border-radius:50%;right:-60px;top:20%;background:conic-gradient(from 180deg at 50% 50%, #12203a, #0b1220 40%, rgba(124,92,255,0.14));box-shadow:0 20px 60px rgba(0,0,0,0.6), inset -12px -8px 40px rgba(255,255,255,0.02);opacity:0.9;transform:scale(.92);filter:blur(0.6px);}

        /* Login card */
        .login{position:relative;z-index:10;width:min(460px,calc(100% - 40px));border-radius:16px;padding:28px;border:1px solid var(--card-border);background:var(--card-bg);backdrop-filter:blur(8px) saturate(1.1);box-shadow:0 12px 40px rgba(6,8,14,0.7),0 0 30px rgba(124,92,255,0.06) inset}
        .brand{font-weight:800;font-size:28px;letter-spacing:-0.6px;display:flex;align-items:center;gap:12px}
        .brand .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-purple));display:inline-grid;place-items:center;color:#021018;font-weight:800;box-shadow:0 6px 18px rgba(124,92,255,0.14);font-size:18px}
        .slogan{margin-top:8px;color:var(--muted);font-size:13px}

        form{margin-top:20px}
        label{display:block;margin:0 0 8px;color:var(--muted);font-size:13px}
        .input-wrap{position:relative;margin-bottom:16px}
        .input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:0.95;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6))}
        input[type=text],input[type=password]{width:100%;padding:12px 14px 12px 40px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));color:var(--text);font-size:15px;transition:box-shadow .18s ease,transform .12s ease}
        input:focus{outline:none;box-shadow:0 8px 30px rgba(124,92,255,0.12),0 0 8px rgba(0,240,255,0.06);border-color:rgba(124,92,255,0.28);transform:translateY(-1px)}

        .actions{display:flex;align-items:center;gap:10px;margin-top:6px}
        button{flex:1;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple));color:#021018;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(124,92,255,0.12);transition:transform .12s ease,box-shadow .18s ease}
        button:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(124,92,255,0.18)}

        .error{min-height:22px;margin-top:12px;color:var(--danger);font-weight:700}

        /* small footer */
        .credits{margin-top:16px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

        @media(max-width:520px){.login{width:calc(100% - 28px);padding:20px}.brand{font-size:20px}.planet{display:none}}
    </style>
</head>
<body>
<div class="scene">
    <div class="nebula"></div>
    <div class="stars"></div>
    <div class="planet" aria-hidden="true"></div>
</div>

<main class="login">
    <div style="display:flex;flex-direction:column">
        <div class="brand">
            <div class="logo">FT</div>
            <div>
                FakeTrace
                <div class="slogan">Detectando desinformación en tiempo real</div>
            </div>
        </div>

        <form id="login-form">
            <label for="username">Usuario</label>
            <div class="input-wrap">
                <!-- user icon -->
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12a4 4 0 100-8 4 4 0 000 8z" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 20c0-3.866 3.582-7 9-7s9 3.134 9 7" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <input id="username" name="username" type="text" autocomplete="username" required>
            </div>

            <label for="password">Contraseña</label>
            <div class="input-wrap">
                <!-- lock icon -->
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="11" width="18" height="10" rx="2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 11V8a5 5 0 0110 0v3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <div class="actions">
                <button type="submit">Ingresar</button>
            </div>

            <div id="error-msg" class="error"></div>
        </form>

        <div class="credits"><span>© FakeTrace</span><span style="color:var(--muted)">AI · Threat Intelligence</span></div>
    </div>
</main>

<!-- Decorative particles script (no auth logic) -->
<script>
(function(){
  const canvas = document.createElement('canvas');
  canvas.style.position='fixed';canvas.style.inset='0';canvas.style.zIndex=5;canvas.style.pointerEvents='none';
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');let w=canvas.width=innerWidth,h=canvas.height=innerHeight;const stars=[];for(let i=0;i<120;i++){stars.push({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1.2+0.2,v:Math.random()*0.3+0.05})}
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
  addEventListener('resize',resize);
  function draw(){ctx.clearRect(0,0,w,h);for(const s of stars){s.x+=s.v; if(s.x>w)s.x=0; const rad=1.2*s.z; ctx.beginPath(); ctx.fillStyle='rgba(200,240,255,'+ (0.5*s.z) +')'; ctx.arc(s.x,s.y,rad,0,Math.PI*2); ctx.fill()}requestAnimationFrame(draw)}
  draw();
})();
</script>

<script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');

    // Si ya hay una sesion local activa, envia al dashboard.
    if (sessionStorage.getItem('faketraceAuth') === 'true') {
        window.location.href = 'index.html';
    }

    // Envia las credenciales al backend y guarda la sesion local si son validas.
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorMsg.textContent = '';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const response = await fetch(`${window.location.origin}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const rawResponse = await response.text();
            let data = {};

            try {
                data = rawResponse ? JSON.parse(rawResponse) : {};
            } catch (parseError) {
                throw new Error('El endpoint de login no devolvio JSON. Reinicia Spring Boot y entra desde http://localhost:8080/login.html');
            }

            if (!response.ok) throw new Error(data.message || 'No se pudo iniciar sesion');

            sessionStorage.setItem('faketraceAuth', 'true');
            sessionStorage.setItem('faketraceUser', data.username);
            window.location.href = 'index.html';
        } catch (error) {
            errorMsg.textContent = error.message;
        }
    });
</script>
</body>
</html>
